version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: milhub_postgres
    environment:
      POSTGRES_DB: milhub_verification
      POSTGRES_USER: milhub
      POSTGRES_PASSWORD: milhub
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching, queues, and rate limiting
  redis:
    image: redis:7-alpine
    container_name: milhub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # API Gateway (NGINX)
  api_gateway:
    image: nginx:alpine
    container_name: milhub_api_gateway
    ports:
      - "8080:80"
    volumes:
      - ./api_gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./api_gateway/conf.d:/etc/nginx/conf.d
      - ./logs:/var/log/nginx
    depends_on:
      - orchestrator
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Verification Orchestrator Service
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: milhub_orchestrator
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://milhub:milhub@postgres:5432/milhub_verification
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ./orchestrator:/app
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Image Verification Service
  image_service:
    build:
      context: ./services/image_verification
      dockerfile: Dockerfile
    container_name: milhub_image_service
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - ML_DEVICE=cpu  # Change to cuda for GPU support
    volumes:
      - ./services/image_verification:/app
      - ./models:/app/models
    depends_on:
      - redis
    command: celery -A worker worker --loglevel=info

  # Video Verification Service
  video_service:
    build:
      context: ./services/video_verification
      dockerfile: Dockerfile
    container_name: milhub_video_service
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - ML_DEVICE=cpu  # Change to cuda for GPU support
    volumes:
      - ./services/video_verification:/app
      - ./models:/app/models
    depends_on:
      - redis
    command: celery -A worker worker --loglevel=info

  # Context Engine Service
  context_engine:
    build:
      context: ./services/context_engine
      dockerfile: Dockerfile
    container_name: milhub_context_engine
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./services/context_engine:/app
    depends_on:
      - redis
    command: celery -A worker worker --loglevel=info

  # Scoring Engine Service
  scoring_engine:
    build:
      context: ./scoring
      dockerfile: Dockerfile
    container_name: milhub_scoring_engine
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://milhub:milhub@postgres:5432/milhub_verification
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./scoring:/app
    depends_on:
      - postgres
      - redis
    command: celery -A worker worker --loglevel=info

  # Celery Beat for scheduled tasks
  celery_beat:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: milhub_celery_beat
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./orchestrator:/app
    depends_on:
      - redis
    command: celery -A main.celery_app beat --loglevel=info

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: milhub_flower
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A main.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  uploads: